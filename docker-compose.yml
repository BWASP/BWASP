services:
  api:
    build:
      context: container/api
      dockerfile: Dockerfile
    ports:
      - 20000:3000
    environment:
      - TZ=Asia/Seoul
      - LANG=C.UTF-8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=bwasp
    restart: always
    volumes:
      - dependency_data:/app/dependency_data
    depends_on:
      - db
      - redis
  
  client:
    build:
      context: container/client
      dockerfile: Dockerfile
    ports:
      - 20001:3000
    environment:
      - TZ=Asia/Seoul
      - LANG=C.UTF-8
    restart: always
    volumes:
      - dependency_data:/app/dependency_data
    depends_on:
      - api
      - redis

  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      - TZ=Asia/Seoul
      - PGTZ=Asia/Seoul
      - LANG=C.UTF-8
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=bwasp
      # 서브디렉토리에 데이터 저장 (.gitkeep 문제 해결)
      - PGDATA=/var/lib/postgresql/data/pg_data
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/pg_data
    command: sh -c "rm -f /var/lib/postgresql/data/pg_data/.gitkeep && docker-entrypoint.sh postgres"

  redis:
    image: redis:alpine
    environment:
      - TZ=Asia/Seoul
      - LANG=C.UTF-8
    restart: always
    volumes:
      - redis_data:/data

  processor:
    build:
      context: container/processor
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=Asia/Seoul
      - LANG=C.UTF-8
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - API_HOST=api
      - API_PORT=3000
    depends_on:
      - db
      - redis
      - api
    volumes:
      - dependency_data:/app/dependency_data

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./container/db/pg_data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./container/db/redis_data
  dependency_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./container/dependency_data