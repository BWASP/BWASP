services:
  browser_extension_api:
    build:
      context: ManualAPI
      dockerfile: Dockerfile
    ports:
      - 20202:20202
    volumes:
      - ./ManualAPI/src:/app/src
      - ./ManualAPI/requirements.txt:/app/requirements.txt
    depends_on:
      - database
  
  api:
    build:
      context: RestAPI
      dockerfile: Dockerfile
    ports:
      - 20102:20102
    volumes:
      - ./RestAPI/src:/app/src
      - ./RestAPI/requirements.txt:/app/requirements.txt
    depends_on:
      - database
  
  web:
    build:
      context: Web
      dockerfile: Dockerfile
    ports:
      - 20002:20002
    volumes:
      - ./Web/src:/app/src
      - ./Web/requirements.txt:/app/requirements.txt
    depends_on:
      - database

  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      - TZ=Asia/Seoul
      - PGTZ=Asia/Seoul
      - LANG=C.UTF-8
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=bwasp
    volumes:
      - ./db/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    environment:
      - TZ=Asia/Seoul
      - LANG=C.UTF-8
    ports:
      - 6379:6379
    volumes:
      - ./db/redis_data:/data

networks:
  bwasp-network:
    driver: bridge